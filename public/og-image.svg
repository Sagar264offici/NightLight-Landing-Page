<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05070A"/>
      <stop offset="50%" style="stop-color:#080C12"/>
      <stop offset="100%" style="stop-color:#05070A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#D8B56A;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#D8B56A;stop-opacity:0"/>
    </radialGradient>
    <mask id="moon-mask">
      <rect width="1200" height="630" fill="white"/>
      <circle cx="900" cy="150" r="120" fill="black"/>
    </mask>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(216,181,106,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Brand mark -->
  <circle cx="200" cy="200" r="100" fill="#0D131B" filter="drop-shadow(0 4px 20px rgba(0,0,0,0.5)) drop-shadow(0 0 0 1px rgba(216,181,106,0.1))"/>
  <circle cx="200" cy="200" r="100" fill="#A9C8FF" mask="url(#moon-mask)"/>
  
  <!-- Title -->
  <text x="360" y="200" font-family="Space Grotesk, system-ui, sans-serif" font-size="64" font-weight="700" fill="#F4EEE5" letter-spacing="-1.6">NightLight</text>
  
  <!-- Subtitle -->
  <text x="360" y="275" font-family="Space Grotesk, system-ui, sans-serif" font-size="28" font-weight="400" fill="#B8B2A8">Free Music Player for the Web</text>
  
  <!-- Accent line -->
  <line x1="360" y1="305" x2="580" y2="305" stroke="#D8B56A" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Description -->
  <text x="360" y="355" font-family="Space Grotesk, system-ui, sans-serif" font-size="20" font-weight="400" fill="#8A847A" opacity="0.9">Simple, fast, focused music listening in your browser</text>
  
  <!-- Phone mockup on right -->
  <g transform="translate(820, 140)">
    <!-- Phone body -->
    <rect x="0" y="0" width="280" height="500" rx="36" fill="url(#phone-body)"/>
    <defs>
      <linearGradient id="phone-body" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#D8B56A;stop-opacity:0.3"/>
        <stop offset="30%" style="stop-color:#141A24;stop-opacity:0.9"/>
        <stop offset="60%" style="stop-color:#141A24;stop-opacity:0.9"/>
        <stop offset="100%" style="stop-color:#D8B56A;stop-opacity:0.3"/>
      </linearGradient>
    </defs>
    
    <!-- Phone screen -->
    <rect x="14" y="14" width="252" height="472" rx="24" fill="#0A0E15"/>
    
    <!-- Camera -->
    <circle cx="140" cy="24" r="5" fill="#01030A"/>
    
    <!-- Now playing UI -->
    <g transform="translate(30, 60)">
      <!-- Album art -->
      <rect x="0" y="0" width="220" height="220" rx="16" fill="url(#album-art)"/>
      <defs>
        <linearGradient id="album-art" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#D8B56A"/>
          <stop offset="50%" style="stop-color:#6C5CE7"/>
          <stop offset="100%" style="stop-color:#FD79A8"/>
        </linearGradient>
      </defs>
      
      <!-- Track info -->
      <text x="110" y="265" font-family="Space Grotesk, system-ui, sans-serif" font-size="18" font-weight="500" fill="#F4EEE5" text-anchor="middle">Perfect</text>
      <text x="110" y="290" font-family="Space Grotesk, system-ui, sans-serif" font-size="14" fill="#B8B2A8" text-anchor="middle">Ed Sheeran</text>
      
      <!-- Progress bar -->
      <rect x="20" y="320" width="180" height="4" rx="2" fill="rgba(184,178,168,0.2)"/>
      <rect x="20" y="320" width="72" height="4" rx="2" fill="#D8B56A"/>
      
      <!-- Play button -->
      <circle cx="140" cy="370" r="28" fill="url(#play-btn)"/>
      <defs>
        <linearGradient id="play-btn" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#F4EEE5"/>
          <stop offset="50%" style="stop-color:#D8B56A"/>
          <stop offset="100%" style="stop-color:#C4A04A"/>
        </linearGradient>
      </defs>
      <polygon points="130,355 130,385 155,370" fill="#0A0F18"/>
    </g>
  </g>
  
  <!-- URL at bottom -->
  <text x="600" y="580" font-family="Space Grotesk, system-ui, sans-serif" font-size="16" font-weight="500" fill="#D8B56A" text-anchor="middle" opacity="0.8">nightlightmusic.vercel.app</text>
</svg>