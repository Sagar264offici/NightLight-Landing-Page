<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070A" />
    <meta name="color-scheme" content="dark" />

    <!--
      Everything between the seo markers is a *fallback* for `vite dev` and the
      Vercel build template. `scripts/prerender.mjs` overwrites this whole block
      per route from src/config/seo.ts, which is the only place these tags are
      authored — so no page can ship a duplicate or mismatched head.
    -->
    <!--seo:start-->
    <title>NightLight — Modern Android Music Player</title>
    <meta name="description" content="NightLight is a modern Android music player with mood-aware shuffle, contextual discovery, trending music, playlists, favorites, lyrics, and background playback." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nightlightmusic.vercel.app/" />
    <!--seo:end-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
